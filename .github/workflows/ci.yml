name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: dcab validate --fixtures fixtures
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel contains usable bundled fixtures
        run: |
          install_root=$(mktemp -d)
          python -m venv "$install_root/venv"
          "$install_root/venv/bin/python" -m pip install dist/*.whl
          "$install_root/venv/bin/dcab" validate
      - name: Verify sdist contains usable bundled fixtures
        run: |
          install_root=$(mktemp -d)
          python -m venv "$install_root/venv"
          "$install_root/venv/bin/python" -m pip install dist/*.tar.gz
          "$install_root/venv/bin/dcab" validate

  docfence-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' 'git+https://github.com/SybilGambleyyu/docfence.git@v0.48.0'
      - run: DCAB_DOCFENCE_EXECUTABLE="$(command -v docfence)" python -m pytest -ra
